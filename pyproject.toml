[project]
name = "cnmfe"
version = "0.1.0"
description = "Clean CNMFe implementation for 1-photon calcium imaging"
requires-python = ">=3.10"
dependencies = [
    "numpy >= 1.24",
    "scipy >= 1.10",
    "scikit-image >= 0.20",
    "scikit-learn >= 1.2",
    "joblib >= 1.2",
    "zarr >= 3.0",
    "imageio >= 2.28",
    "imageio-ffmpeg >= 0.4",
    "av >= 10.0",
    "matplotlib >= 3.7",
    "tqdm >= 4.0",
    "opencv-python >= 4.5",
]

[project.optional-dependencies]
test = ["pytest >= 7.0", "pytest-cov"]
tutorial = ["jupyter", "matplotlib >= 3.7", "ipywidgets"]
# Faster OASIS deconvolution. Without it `cnmfe/temporal.py` falls back to
# a pure-Python PAVA AR(1) solver (same algorithm, slower for long traces).
oasis = ["oasis-deconvolution"]
# Install cupy matching your CUDA version, e.g.:
#   pip install cupy-cuda12x   (CUDA 12.x)
#   pip install cupy-cuda11x   (CUDA 11.x)
gpu = ["cupy-cuda12x >= 12.0"]
dev = ["cnmfe[test,tutorial,oasis]", "ruff"]

[build-system]
requires = ["setuptools >= 61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cnmfe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
