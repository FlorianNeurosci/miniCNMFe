[project]
name = "minicnmfe"
version = "0.1.0"
description = "minicnmfe — clean CNMF-E for 1-photon miniscope calcium imaging"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Florian Steenbergen" }]
keywords = ["calcium-imaging", "miniscope", "CNMF-E", "neuroscience", "1-photon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy >= 1.24",
    "scipy >= 1.10",
    "scikit-image >= 0.20",
    "scikit-learn >= 1.2",
    "joblib >= 1.2",
    "threadpoolctl >= 3.0",
    # GIL-free per-pixel coordinate descent in update_spatial (numba prange
    # kernel). Without it the parallel spatial update falls back to a GIL-bound
    # threaded path that does not scale on many-core boxes. Pip-only wheels.
    "numba >= 0.60",
    "zarr >= 3.0",
    "imageio >= 2.28",
    "imageio-ffmpeg >= 0.4",
    "av >= 10.0",
    "matplotlib >= 3.7",
    "tqdm >= 4.0",
    "opencv-python >= 4.5",
    # Compiled OASIS AR deconvolution. Without it `minicnmfe/temporal.py` falls
    # back to a pure-Python PAVA AR(1) solver that is far slower AND gets no
    # parallelism from the threaded temporal path (the GIL is never released),
    # so deconvolution runs effectively serial across all K components. Kept in
    # core deps so a plain `pip install -e .` gets the fast path. Ships as a
    # prebuilt wheel (no compiler needed).
    "oasis-deconv",
]

[project.optional-dependencies]
test = ["pytest >= 7.0", "pytest-cov"]
tutorial = ["jupyter", "matplotlib >= 3.7", "ipywidgets"]
# Faster OASIS deconvolution (also in core deps; kept as an extra for back-compat).
# Without it `minicnmfe/temporal.py` falls back to a pure-Python PAVA AR(1) solver
# (same algorithm, slower for long traces).
oasis = ["oasis-deconv"]
# Install cupy matching your CUDA version, e.g.:
#   pip install cupy-cuda12x   (CUDA 12.x)
#   pip install cupy-cuda11x   (CUDA 11.x)
gpu = ["cupy-cuda12x >= 12.0"]
# Build the MkDocs Material documentation site locally (`mkdocs serve` / `mkdocs build`).
docs = ["mkdocs-material >= 9.5", "pymdown-extensions >= 10.0"]
dev = ["minicnmfe[test,tutorial,oasis]", "ruff"]

[project.urls]
Homepage = "https://github.com/FlorianNeurosci/miniCNMFe"
Repository = "https://github.com/FlorianNeurosci/miniCNMFe"
Documentation = "https://florianneurosci.github.io/miniCNMFe/"

[build-system]
requires = ["setuptools >= 77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["minicnmfe*", "tuning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# Project root on sys.path so tests can import top-level scripts
# (`full_pipeline`, `run_*`, `validate_session`, ...) and the
# `tests.conftest` namespace package.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
